# XenonRecomp config for NFS: ProStreet (Xbox 360, USA, En/Es)
# default.xex SHA-256 4f8b623a2a1ed06555b57da4e70411574ac962bce4b81bb100629ecc518275c2
# Paths are relative to this file. Needs XenonRecomp with patch 0009+.
#
# Regenerate the generated blocks and switch tables (from the repo root):
#   tools/XenonRecomp/build/XenonAnalyse/XenonAnalyse game-prostreet/files/default.xex game-prostreet/survey/switch_tables.raw.toml
#   SB_GAME=prostreet python3 survey/fix_switch_tables.py
#   (recompile, then) SB_GAME=prostreet python3 survey/find_missing_tables.py > config/prostreet/switch_tables_inline.toml
#   SB_GAME=prostreet python3 survey/fix_switch_tables.py
#   SB_GAME=prostreet python3 survey/leaf_switch_bounds.py --write
#   (recompile, then) SB_GAME=prostreet python3 survey/find_entry_points.py --write

[main]
file_path = "../../game-prostreet/files/default.xex"
out_directory_path = "../../ppc-prostreet"
switch_table_file_path = "switch_tables.toml"

# Optimizations stay off until the recompilation runs correctly.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Found by survey/xexsurvey.cpp byte patterns (one hit each): the same XDK
# CRT layout as Most Wanted's and Carbon's (restgpr = savegpr + 0x50,
# vmx_64 = vmx_14 + 0x94).
restgprlr_14_address = 0x82A280F0
savegprlr_14_address = 0x82A280A0
restfpr_14_address = 0x82A2876C
savefpr_14_address = 0x82A28720
restvmx_14_address = 0x82A2A538
savevmx_14_address = 0x82A2A2A0
restvmx_64_address = 0x82A2A5CC
savevmx_64_address = 0x82A2A334

# longjmp: the only .pdata function that loads r14-r31 (18 ld, from r7),
# restores CR with mtcrf and calls RtlUnwind (import thunk 0x82ADBA24).
# setjmp: leaf; hook check (lis r4,0x830A / lwz r0 / bnectr, hook pointer
# 0x8309C704), then mflr/mfcr and 19 std into r3, as Carbon's.
longjmp_address = 0x82A26C50
setjmp_address = 0x82A28DB0

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
]

# --- generated by survey/find_entry_points.py --write ---
# Secondary entry points: code addresses the game calls through pointers
# that lie inside another function. Do not edit by hand; rerun.
secondary_entries = [
    0x825553C0,  # referenced from code; leaf code
    0x82A263DC,  # referenced from code; in .pdata fn 0x82A262B0
    0x82A33178,  # referenced from data; in .pdata fn 0x82A330D0
    0x82A333D0,  # referenced from data; in .pdata fn 0x82A332D0
    0x82A37D00,  # referenced from data; in .pdata fn 0x82A37C38
    0x82A6848C,  # referenced from data; in .pdata fn 0x82A68338
]
# --- end find_entry_points ---

